name: Validate and publish translations
on:
  push:
    branches: [main]
    paths:
      - 'languages/**'
      - 'scripts/publish.py'
      - '.github/workflows/publish.yml'
  pull_request:
    paths:
      - 'languages/**'
      - 'scripts/publish.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate packs and generate manifest
        run: python3 scripts/publish.py
      - name: Verify generated manifest on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- manifest.json || echo 'Manifest will be regenerated on merge'
      - name: Commit published manifest
        if: github.event_name != 'pull_request'
        run: |
          if ! git diff --quiet -- manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Publish validated translation manifest"
            git push
          fi

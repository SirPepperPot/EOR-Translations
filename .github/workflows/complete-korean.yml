name: Complete Korean translation
on:
  push:
    paths:
      - 'scripts/complete_korean.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'deep-translator==1.11.4'
      - name: Translate remaining English entries and validate
        run: python scripts/complete_korean.py
      - name: Commit completed Korean catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add languages/ko.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Complete Korean localization with machine translation"
            git push
          fi
